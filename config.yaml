# Photo Culler configuration.
#
# Every value here is a default that command-line flags override. Delete any key to
# fall back to the built-in default; delete the whole file and the tool still runs.

model:
  # Leave blank to auto-detect the best installed vision model in Ollama.
  # Override with a tag such as qwen3-vl:30b-a3b-instruct.
  name:
  host: http://localhost:11434
  timeout_seconds: 300

  # Prove the model can actually see images before analysing a shoot. Turning this off
  # is not recommended: a model without a vision encoder returns invented judgements.
  verify_vision: true

  # Context window requested from Ollama. Leave this alone unless analysis starts
  # failing on unusually large images.
  #
  # Ollama otherwise sizes the context from the model's maximum, which for qwen3-vl is
  # 262,144 tokens, and reserves memory accordingly: a 20GB model became 46GB resident.
  # One photograph plus its detail crop measures around 2,100 tokens, so this is already
  # generous, and it keeps the same model at 19.8GB. Same speed, far more headroom.
  context_tokens: 8192

processing:
  # Parallel requests to the vision model. One is the right default: Ollama gives each
  # parallel slot its own context, so a 20GB model asked for four of them wanted 46GB on
  # a 64GB machine, started swapping, and got dramatically slower. A single request
  # already keeps the GPU busy on Apple Silicon.
  #
  # Raise it only with memory to spare, and set OLLAMA_NUM_PARALLEL to match.
  workers: 1

  # Fast mode is plain CPU work with no model loaded, so it parallelises freely.
  fast_workers: 8

  # Generate descriptions and keywords for frames that are not being rejected.
  # Roughly doubles the time per photo.
  tagging: true

  recursive: true

grouping:
  # Frames taken within this many seconds of each other, that also look alike, are
  # treated as one burst; only the strongest frame stays in Keep.
  enabled: true
  burst_gap_seconds: 3.0

# How much slack the culler gets before it may reject a photograph. Deleting always
# needs two independent witnesses (the model and a measurement) regardless of these.
decisions:
  # A frame with provably sharp detail somewhere is never deleted for blur, even if the
  # model calls it soft. Protects shallow depth of field, fog and minimal compositions.
  sharp_evidence_vetoes_delete: true

# Analysis results are cached per file so an interrupted run resumes where it stopped
# and re-runs only analyse what changed. Set to an empty value to disable.
cache:
  dir: ~/.cache/photo_culler

output:
  # Written next to the photos unless an absolute path is given.
  csv_dir: cull_runs

  extensions:
    - .nef
    - .cr2
    - .cr3
    - .arw
    - .dng
    - .raf
    - .rw2
    - .orf
    - .jpg
    - .jpeg
    - .heic
    - .heif
